    <path fill="#FFFFFF" fill-rule="evenodd" d="M35.19,27.48c-.69,1.16-1.37,2.29-2.1,3.52-.61-.5-1.18-.92-1.69-1.4-1.51-1.43-2.56-3.16-3.21-5.14-.13-.4-.1-.69.22-1.02,1.45-1.52,1.41-3.74-.02-5.31-.15-.16-.3-.47-.25-.65.78-2.85,2.46-5.06,4.96-6.81.7,1.17,1.39,2.31,2.07,3.45-4.92,3.61-4.21,10.37.02,13.37Z"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M34.4,31.61c.63-1.14,1.28-2.29,1.94-3.47,1.24.51,2.48.78,3.78.74,3.79-.12,7.1-3.03,7.63-6.79.07-.47.22-.62.69-.6.98.04,1.96.02,2.94.02.39,0,.54.14.5.55-.28,2.78-1.41,5.17-3.35,7.17-.13.13-.44.18-.64.14-2.24-.47-4.04.59-4.74,2.8-.05.16-.22.37-.36.41-2.86.71-5.62.46-8.27-.84-.03-.02-.05-.06-.11-.13Z"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M36.33,13.5c-.67-1.2-1.31-2.35-1.97-3.54,1.2-.66,2.43-.99,3.7-1.18,1.53-.23,3.05-.17,4.55.23.22.06.47.31.54.52.67,2.1,2.57,3.2,4.74,2.72.2-.04.52,0,.64.14,1.98,2.08,3.14,4.54,3.35,7.42,0,.06-.02.12-.05.3-.83,0-1.68,0-2.53,0-.46,0-1.04.16-1.35-.07-.27-.19-.23-.82-.34-1.25-1.17-4.62-6.14-7.21-10.64-5.56-.19.07-.38.15-.65.25Z"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M25.59,23.64c-1.57,0-2.84-1.29-2.83-2.84.01-1.55,1.32-2.85,2.86-2.85,1.59,0,2.84,1.28,2.83,2.9-.01,1.58-1.25,2.79-2.86,2.79Z"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M46.86,11.37c-1.57,0-2.82-1.28-2.81-2.87.01-1.58,1.28-2.82,2.87-2.81,1.55.01,2.86,1.34,2.83,2.87-.03,1.57-1.31,2.81-2.89,2.81Z"/>
    <path fill="#FFFFFF" fill-rule="evenodd" d="M46.86,35.93c-1.58-.01-2.82-1.26-2.81-2.85,0-1.58,1.27-2.85,2.83-2.85,1.54,0,2.85,1.3,2.87,2.84.02,1.58-1.29,2.87-2.88,2.86Z"/>
  </g>

  <!-- 2. Main Title -->
  <text x="600" y="184"
    font-family="'Ubuntu', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif"
    font-size="52"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    letter-spacing="1">
    Ubuntu Linux <tspan fill="#FF6B35">Course</tspan>
  </text>

  <!-- 3. Subtitle -->
  <text x="600" y="218"
    font-family="'Ubuntu', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif"
    font-size="15"
    font-weight="600"
    text-anchor="middle"
    fill="#E6EDF3"
    letter-spacing="3.5">
    FROM ZERO TO LINUX POWER USER &amp; SYSADMIN
  </text>

  <!-- 4. Expanded Divider Line -->
  <line x1="200" y1="238" x2="1000" y2="238" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>

  <!-- 5. Centered Badges Row -->
  <g transform="translate(203, 262)">
    <!-- Badge 1: 12 Modules -->
    <g transform="translate(0, 0)">
      <rect width="118" height="34" rx="17" fill="#E95420" fill-opacity="0.25" stroke="#FF6B35" stroke-width="1.5"/>
      <text x="59" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FF8C61">📦 12 Modules</text>
    </g>

    <!-- Badge 2: 100+ Commands -->
    <g transform="translate(133, 0)">
      <rect width="130" height="34" rx="17" fill="#39D353" fill-opacity="0.2" stroke="#39D353" stroke-width="1.5"/>
      <text x="65" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#56F06F">🖥️ 100+ Commands</text>
    </g>

    <!-- Badge 3: Shell Scripting -->
    <g transform="translate(278, 0)">
      <rect width="134" height="34" rx="17" fill="#58A6FF" fill-opacity="0.2" stroke="#58A6FF" stroke-width="1.5"/>
      <text x="67" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#79C0FF">🐚 Shell Scripting</text>
    </g>

    <!-- Badge 4: Networking -->
    <g transform="translate(427, 0)">
      <rect width="116" height="34" rx="17" fill="#BC8CFF" fill-opacity="0.2" stroke="#BC8CFF" stroke-width="1.5"/>
      <text x="58" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#D2A8FF">🌐 Networking</text>
    </g>

    <!-- Badge 5: Permissions -->
    <g transform="translate(558, 0)">
      <rect width="116" height="34" rx="17" fill="#FFA657" fill-opacity="0.2" stroke="#FFA657" stroke-width="1.5"/>
      <text x="58" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FFC28D">🔐 Permissions</text>
    </g>

    <!-- Badge 6: Sysadmin -->
    <g transform="translate(689, 0)">
      <rect width="105" height="34" rx="17" fill="#E95420" fill-opacity="0.25" stroke="#FF6B35" stroke-width="1.5"/>
      <text x="52" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#FF8C61">⚙️ Sysadmin</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="352" width="1200" height="8" fill="#E95420"/>
  <rect x="300" y="352" width="600" height="8" fill="#77216F"/>
</svg>
