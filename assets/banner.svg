<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient: Deep Ubuntu Dark / Github Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0e14" />
      <stop offset="50%" style="stop-color:#161b22" />
      <stop offset="100%" style="stop-color:#1c0517" />
    </linearGradient>

    <!-- Ubuntu Brand Radial Background Glow -->
    <radialGradient id="ubuntuGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:#E95420;stop-opacity:0.38" />
      <stop offset="60%" style="stop-color:#77216F;stop-opacity:0.20" />
      <stop offset="100%" style="stop-color:#0b0e14;stop-opacity:0" />
    </radialGradient>

    <!-- Filter for soft glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#ubuntuGlow)" />

  <!-- Subtle Terminal Grid Pattern -->
  <g opacity="0.05" stroke="#E95420" stroke-width="0.8">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Top Terminal Bar Header (Height: 30px, Top: 18px -> Bottom: 48px) -->
  <rect x="24" y="18" width="1152" height="30" rx="6" fill="#161b22" opacity="0.85" stroke="#30363d" stroke-width="1"/>
  <circle cx="44" cy="33" r="5" fill="#ff5f56"/>
  <circle cx="60" cy="33" r="5" fill="#ffbd2e"/>
  <circle cx="76" cy="33" r="5" fill="#27c93f"/>
  <text x="98" y="38" font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#39d353">akash@ubuntu: ~/ubuntu (main)</text>

  <!-- CENTERED CONTENT GROUP -->
  <!-- 1. Official Ubuntu Emblem -->
  <g transform="translate(600, 106) scale(1.5) translate(-39.8, -20.8)" filter="url(#logoGlow)">
